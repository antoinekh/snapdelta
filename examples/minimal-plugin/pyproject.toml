[project]
name = "snapdelta-example"
version = "0.1.0"
description = "Minimal snapdelta plugin: models and a JSON loader to copy for a new project"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["snapdelta"]

[project.entry-points."snapdelta.sources"]
example = "snapdelta_example:ExampleSource"
example-live = "snapdelta_example:ExampleLiveSource"

[tool.uv.sources]
snapdelta = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapdelta_example"]
