# A shared snapdelta server with a PostgreSQL store:
#   SNAPDELTA_TOKEN=... SNAPDELTA_DB_PASSWORD=... docker compose -f docker/compose.yaml up -d
services:
  snapdelta:
    build: ..
    image: ghcr.io/antoinekh/snapdelta:latest
    ports: ["8765:8765"]
    environment:
      SNAPDELTA_TOKEN: ${SNAPDELTA_TOKEN:?set SNAPDELTA_TOKEN}
      SNAPDELTA_DB_PASSWORD: ${SNAPDELTA_DB_PASSWORD:?set SNAPDELTA_DB_PASSWORD}
    volumes:
      - ./compose.toml:/etc/snapdelta/snapdelta.toml:ro
      - snapdelta-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: snapdelta
      POSTGRES_DB: snapdelta
      POSTGRES_PASSWORD: ${SNAPDELTA_DB_PASSWORD:?set SNAPDELTA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "snapdelta"]
      interval: 2s
      retries: 30
    restart: unless-stopped

volumes:
  snapdelta-data:
  postgres-data:
