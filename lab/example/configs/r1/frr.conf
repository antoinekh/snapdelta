frr defaults traditional
hostname r1
domainname snapdelta.lab
log stdout informational
!
interface eth1
 description trunk to r2
!
interface eth1.10
 description trunk to r2, vlan 10
 ip address 10.12.10.1/24
!
interface eth2
 description to r3
 ip address 10.13.0.1/24
!
interface lan
 description customer lan
 ip address 192.168.1.1/24
!
interface lo
 ip address 10.0.0.1/32
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.12.10.2 remote-as 65002
 neighbor 10.12.10.2 description r2
 neighbor 10.13.0.3 remote-as 65003
 neighbor 10.13.0.3 description r3
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  network 192.168.1.0/24
 exit-address-family
!
