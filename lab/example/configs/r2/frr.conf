frr defaults traditional
hostname r2
domainname snapdelta.lab
log stdout informational
!
interface eth1
 description trunk to r1
!
interface eth1.10
 description trunk to r1, vlan 10
 ip address 10.12.10.2/24
!
interface eth2
 description to r3
 ip address 10.23.0.2/24
!
interface lan
 description customer lan
 ip address 192.168.2.1/24
!
interface lo
 ip address 10.0.0.2/32
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.12.10.1 remote-as 65001
 neighbor 10.12.10.1 description r1
 neighbor 10.23.0.3 remote-as 65003
 neighbor 10.23.0.3 description r3
 !
 address-family ipv4 unicast
  network 10.0.0.2/32
  network 192.168.2.0/24
 exit-address-family
!
