name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    # The tests of snapdelta-postgres run against this server; without it, they are skipped.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: snapdelta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SNAPDELTA_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
      PGPASSWORD: snapdelta
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: make lint
