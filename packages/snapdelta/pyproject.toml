[project]
name = "snapdelta"
version = "0.1.0"
description = "Snapshot your devices and services, then see exactly what changed: CLI and Python API, built on diffsync"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Antoine Keranflec'h", email = "antoine.keranflech@gmail.com" }]
keywords = ["network-automation", "netdevops", "snapshot", "diff", "diffsync", "nornir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["diffsync>=2.2,<3", "pydantic>=2.7", "pyyaml>=6", "typer>=0.12", "tomlkit>=0.15"]

[project.optional-dependencies]
# The contract tests of snapdelta.testing, for the tests of a plugin.
testing = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/antoinekh/snapdelta"
Documentation = "https://github.com/antoinekh/snapdelta/tree/main/docs"
Issues = "https://github.com/antoinekh/snapdelta/issues"
Changelog = "https://github.com/antoinekh/snapdelta/blob/main/CHANGELOG.md"

[project.scripts]
snapdelta = "snapdelta.cli:app"

# The built-ins are plugins too: the core finds them as it finds the plugins of other packages.
[project.entry-points."snapdelta.stores"]
file = "snapdelta.store:FileStore"
sqlite = "snapdelta.store:SqliteStore"

[project.entry-points."snapdelta.renderers"]
text = "snapdelta.render:TEXT"
json = "snapdelta.render:JSON"
markdown = "snapdelta.render:MARKDOWN"
csv = "snapdelta.render:CSV"

[project.entry-points."snapdelta.inventories"]
nornir = "snapdelta.inventory:NornirInventory"

[project.entry-points."snapdelta.secrets"]
env = "snapdelta.secrets:EnvSecrets"
file = "snapdelta.secrets:FileSecrets"

[project.entry-points."snapdelta.notifiers"]
webhook = "snapdelta.notify:Webhook"
command = "snapdelta.notify:Command"

[project.entry-points."snapdelta.rules"]
case-insensitive = "snapdelta.rules:CaseInsensitive"
whitespace = "snapdelta.rules:Whitespace"
unordered = "snapdelta.rules:Unordered"
ip-address = "snapdelta.rules:IpAddress"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapdelta"]
