[project]
name = "snapdelta-web"
version = "0.1.0"
description = "Web UI, JSON API and MCP server for snapdelta: snapshot your devices and services, then see exactly what changed"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Antoine Keranflec'h", email = "antoine.keranflech@gmail.com" }]
keywords = ["network-automation", "netdevops", "snapshot", "diff", "diffsync", "mcp", "fastapi", "plugin-architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "snapdelta>=0.1.0,<0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "python-multipart>=0.0.9",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/antoinekh/snapdelta"
Documentation = "https://github.com/antoinekh/snapdelta/tree/main/docs"
Issues = "https://github.com/antoinekh/snapdelta/issues"
Changelog = "https://github.com/antoinekh/snapdelta/blob/main/CHANGELOG.md"

[project.scripts]
snapdelta-web = "snapdelta_web.cli:app"
snapdelta-mcp = "snapdelta_web.mcp_server:app"

# The web UI declares its own extension point, which `snapdelta plugins` and `snapdelta doctor` then show.
[project.entry-points."snapdelta.extension_points"]
auth = "snapdelta_web.auth:AUTH"

[project.entry-points."snapdelta.auth"]
token = "snapdelta_web.auth:TokenAuth"
header = "snapdelta_web.auth:HeaderAuth"
none = "snapdelta_web.auth:NoAuth"

[tool.uv.sources]
snapdelta = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapdelta_web"]
