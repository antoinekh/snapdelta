{% extends "base.html" %}
{% block title %}Log in · snapdelta{% endblock %}
{% block content %}
<section class="login">
  <img src="{{ asset('favicon.svg') }}" width="56" height="56" alt="">
  <h1>Log in</h1>
  {% if failed %}<p class="notice warn">The login was refused: check each field.</p>{% endif %}
  <form method="post" action="/login" class="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    {% for field in fields %}
    <label class="field">{{ field.label }}<input type="{{ 'password' if field.secret else 'text' }}" name="{{ field.name }}" autocomplete="{{ 'current-password' if field.secret else 'username' }}" {{ "autofocus" if loop.first }} {{ "required" if field.required }}></label>
    {% endfor %}
    <button type="submit" class="button primary">Log in</button>
  </form>
</section>
{% endblock %}
