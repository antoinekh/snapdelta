{% extends "base.html" %}
{% block title %}Log in · snapdelta{% endblock %}
{% block content %}
<section class="login">
  <img src="{{ asset('favicon.svg') }}" width="56" height="56" alt="">
  <h1>Log in</h1>
  {% if failed %}<p class="notice warn">This token is not the token of this server.</p>{% endif %}
  <form method="post" action="/login" class="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">Token<input type="password" name="token" autocomplete="current-password" autofocus required></label>
    <button type="submit" class="button primary">Log in</button>
  </form>
</section>
{% endblock %}
