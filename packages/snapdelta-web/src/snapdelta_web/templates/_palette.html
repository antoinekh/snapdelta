{% for group in groups %}
<div class="palette-group" role="group" aria-label="{{ group.title }}">
  <div class="palette-title">{{ group.title }}</div>
  {% for item in group.items %}<a class="palette-item" href="{{ item.url }}" role="option"><span class="palette-label">{{ item.label }}</span>{% if item.detail %}<span class="palette-detail">{{ item.detail }}</span>{% endif %}</a>{% endfor %}
</div>
{% else %}
<p class="palette-empty">Nothing matches {{ query }}.</p>
{% endfor %}
