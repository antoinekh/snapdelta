[project]
name = "snapdelta-postgres"
version = "0.2.0"
description = "PostgreSQL store backend for snapdelta: snapshots, diffs and runs in a database that many servers share"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Antoine Keranflec'h", email = "antoine.keranflech@gmail.com" }]
keywords = ["network-automation", "netdevops", "snapshot", "diff", "postgresql", "plugin-architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = ["snapdelta>=0.2.0,<0.3", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]

[project.urls]
Homepage = "https://github.com/antoinekh/snapdelta"
Documentation = "https://github.com/antoinekh/snapdelta/blob/main/docs/stores.md"
Issues = "https://github.com/antoinekh/snapdelta/issues"
Changelog = "https://github.com/antoinekh/snapdelta/blob/main/CHANGELOG.md"

[project.entry-points."snapdelta.stores"]
postgresql = "snapdelta_postgres:PostgresStore"

[tool.uv.sources]
snapdelta = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapdelta_postgres"]
